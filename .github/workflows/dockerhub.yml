name: dockerhub

on:
  push:
    branches:
      - 'main'
    paths:
      - 'docker/**'
      - '.github/workflows/dockerhub.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/dockerhub.yml'

jobs:
  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      -
        name: Login to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Build and push base docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' }}
          load: true
          platforms: linux/amd64  # linux/arm64
          file: ./docker/base/Dockerfile
          context: ./docker/base/
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/nipa-base:latest
          cache-to: type=inline
          tags: |
            nipa-base
            ghcr.io/${{ github.repository_owner }}/nipa-base:latest
      -
        name: Build and push build docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64  # linux/arm64
          file: ./docker/build/Dockerfile
          context: ./docker/build/
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/nipa-build:latest
          cache-to: type=inline
          tags: |
            nipa-build
            ghcr.io/${{ github.repository_owner }}/nipa-build:latest
      -
        name: Build and push selftests docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64  # linux/arm64
          file: ./docker/selftests/Dockerfile
          context: ./docker/selftests/
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/nipa-selftests:latest
          cache-to: type=inline
          tags: |
            nipa-selftests
            ghcr.io/${{ github.repository_owner }}/nipa-selftests:latest
